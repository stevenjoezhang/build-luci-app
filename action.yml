name: "Build OpenWrt LuCI App"
description: "Composite Action: compile LuCI package into .ipk/.apk and upload artifacts"
inputs:
  package:
    description: "LuCI package directory name (e.g. luci-app-tailscale)"
    required: true
  sdk-url:
    description: "Legacy OpenWrt SDK .tar.xz URL"
    required: true
  snapsdk-url:
    description: "Snapshot OpenWrt SDK .tar.zst URL"
    required: false
  snapsdk-profiles-url:
    description: "Snapshot OpenWrt profiles.json URL used to resolve the current SDK archive"
    required: false
    default: "https://downloads.openwrt.org/snapshots/targets/x86/64/profiles.json"

outputs:
  version:
    description: "Package version extracted from Makefile"
    value: ${{ steps.get_version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Get version from Makefile
      id: get_version
      shell: bash
      run: |
        version=$(grep 'PKG_VERSION:=' Makefile \
                  | awk -F ':=' '{print $2}' \
                  | xargs)
        echo "version=${version}" >> $GITHUB_OUTPUT
        echo "Current Makefile Version: ${version}"

    - name: Install system dependencies & po2lmo
      shell: bash
      run: |
        sudo apt-get update
        sudo apt install software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive \
          apt-get install -y curl git tar zstd python3-pip python3.9 python3.9-distutils
        pip3 install --upgrade pip
        pip3 install po2lmo

    - name: Download Legacy OpenWrt SDK
      shell: bash
      run: |
        mkdir -p /tmp/SDK
        curl -SLk --connect-timeout 30 --retry 2 \
          "${{ inputs['sdk-url'] }}" \
          -o /tmp/SDK.tar.xz
        tar xf /tmp/SDK.tar.xz \
            --strip-components=1 -C /tmp/SDK

    - name: Resolve Snapshot OpenWrt SDK URL
      id: resolve_snapsdk
      shell: bash
      run: |
        profiles_url="${{ inputs['snapsdk-profiles-url'] }}"

        if [ -n "$profiles_url" ]; then
          curl --fail --show-error -SLk --connect-timeout 30 --retry 2 \
            "$profiles_url" \
            -o /tmp/openwrt-profiles.json

          sdk_file="$(python3 - <<'PY'
        import json

        with open("/tmp/openwrt-profiles.json", "r", encoding="utf-8") as f:
            data = json.load(f)

        arch = data.get("arch_packages")
        sdk = data.get("sdk", {})

        if not arch:
            raise SystemExit("profiles.json does not contain arch_packages")

        if arch not in sdk:
            raise SystemExit(f"profiles.json does not contain sdk entry for arch_packages={arch!r}")

        print(sdk[arch])
        PY
        )"

          base_url="${profiles_url%/*}"
          echo "url=${base_url}/${sdk_file}" >> "$GITHUB_OUTPUT"
          echo "Resolved snapshot SDK: ${base_url}/${sdk_file}"
          exit 0
        fi

        if [ -n "${{ inputs['snapsdk-url'] }}" ]; then
          echo "url=${{ inputs['snapsdk-url'] }}" >> "$GITHUB_OUTPUT"
          echo "Using configured snapshot SDK: ${{ inputs['snapsdk-url'] }}"
          exit 0
        fi

        echo "Either snapsdk-profiles-url or snapsdk-url must be provided" >&2
        exit 1

    - name: Download Snapshot OpenWrt SDK
      shell: bash
      run: |
        mkdir -p /tmp/SNAPSDK
        curl --fail --show-error -SLk --connect-timeout 30 --retry 2 \
          "${{ steps.resolve_snapsdk.outputs.url }}" \
          -o /tmp/SNAPSDK.tar.zst
        zstd -d /tmp/SNAPSDK.tar.zst
        tar xf /tmp/SNAPSDK.tar \
            --strip-components=1 -C /tmp/SNAPSDK

    - name: Copy source into SDKs
      shell: bash
      run: |
        mkdir -p /tmp/SDK/package/${{ inputs.package }}
        mkdir -p /tmp/SNAPSDK/package/${{ inputs.package }}
        rsync -avh --exclude='.git' . \
          /tmp/SDK/package/${{ inputs.package }}
        rsync -avh --exclude='.git' . \
          /tmp/SNAPSDK/package/${{ inputs.package }}

    - name: Compile IPK with Legacy SDK
      shell: bash
      run: |
        cd /tmp/SDK
        ./scripts/feeds update -a
        ./scripts/feeds install ${{ inputs.package }}
        echo "CONFIG_PACKAGE_${{ inputs.package }}=y" > .config
        make defconfig
        make package/${{ inputs.package }}/compile V=99

    - name: Compile APK with Snapshot SDK
      shell: bash
      run: |
        cd /tmp/SNAPSDK
        ./scripts/feeds update -a
        ./scripts/feeds install ${{ inputs.package }}
        echo "CONFIG_PACKAGE_${{ inputs.package }}=y" > .config
        make defconfig
        make package/${{ inputs.package }}/compile V=99

    - name: Collect artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        # Copy IPK from legacy SDK
        cp /tmp/SDK/bin/packages/x86_64/base/luci-*_all.ipk "./artifacts/"

        # Copy APK from SNAPSHOT SDK
        cp /tmp/SNAPSDK/bin/packages/x86_64/base/luci-*.apk "./artifacts/"
        echo "v${{ steps.get_version.outputs.version }}" \
          > artifacts/version.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: LuCI-Package-${{ steps.get_version.outputs.version }}
        path: artifacts
